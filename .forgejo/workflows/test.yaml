# Runs the test suite on every push, on this machine and again as a
# Windows binary under Wine, and publishes the API documentation to
# https://jeff.jcollie.page/zig-datetime/ when the push was to main.
#
# The documentation is only published from main, so that a branch build
# cannot replace the site with a work in progress. Everything goes
# through `nix develop`, so the toolchain is the one in flake.nix rather
# than whatever the runner happens to carry.
#
# Every job runs on one of the ephemeral DigitalOcean tiers, which
# substitute from the niks3 cache before cache.nixos.org. Each job ends by
# pushing what it built back there -- only from main, which is the only
# ref niks3 accepts a write from -- so the next droplet starts with the
# dev shell already built rather than from nothing. `!cancelled()` rather
# than `success()` because Nix records only builds that succeeded, so what
# a failed run pushes is whole, and is what the next run wants.

name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    # The medium tier: four whole passes of the suite, each compiling the
    # ICU, Go and node oracles, and one of them zic and every locale.
    runs-on: nixos-do-m
    enable-openid-connect: true
    steps:
      - name: Check out
        # Pinned to a commit rather than a tag, in the format pinact
        # writes, so that what runs here cannot change under a moved tag.
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        # `zig-pkg` is where fetched dependencies land when the Zig cache
        # is inside the tree, and zigwin32 is a hundred thousand generated
        # lines that are not this project's to format.
        run: nix develop .#default -c zig fmt --check . --exclude zig-pkg --exclude upstream/zig-pkg

      - name: Check REUSE compliance
        run: nix develop .#default -c reuse lint

      - name: Realise the Zig packages
        # Every package either manifest names, fetched by Nix -- and so from
        # the niks3 cache once any run on main has pushed them -- rather than
        # by Zig from the network. `--system` then forbids Zig to fetch at
        # all, so a package missing from build.zig.zon.nix is an error naming
        # it. It is given twice because `zig build test` runs a second build
        # in upstream/, which the first `--system` does not reach.
        run: echo "ZIG_SYSTEM=$(nix build --no-link --print-out-paths .#zig-deps)" >> "$GITHUB_ENV"

      - name: Run tests
        run: nix develop .#default -c zig build test --system "$ZIG_SYSTEM" -Dupstream-system="$ZIG_SYSTEM"

      - name: Run tests as though there were no system timezone database
        # The runner has no zoneinfo tree, so the tests that read one skip
        # here and run on a developer's machine, which is the wrong way
        # round: the skips are where a mistake hides. This option empties
        # the directories the tests look in, so both halves are reachable
        # from either kind of machine and each is checked on both.
        run: nix develop .#default -c zig build test -Dno-system-tzdata --system "$ZIG_SYSTEM" -Dupstream-system="$ZIG_SYSTEM"

      - name: Run tests with the locales compiled in
        # `zig build test` already runs the locale oracle, which builds
        # its own copy of the data. This is the other half: that the
        # hundred and thirty-seven of them compile into the library and
        # that every one reads back what it wrote.
        run: nix develop .#default -c zig build test -Dembed-locales --system "$ZIG_SYSTEM" -Dupstream-system="$ZIG_SYSTEM"

      - name: Run tests against the embedded timezone database
        # Builds zic from the IANA sources and regenerates the whole
        # database, which is the only thing that exercises the embedded
        # loader and the agreement between it and the system's copy.
        run: nix develop .#default -c zig build test -Dembed-tzdata --system "$ZIG_SYSTEM" -Dupstream-system="$ZIG_SYSTEM"

      - name: Push to the cache
        if: ${{ !cancelled() && forge.ref == 'refs/heads/main' }}
        uses: https://git.jcollie.dev/jeff/niks3-push@3f85f501658e379783381291241c6f8315a92716
        with:
          server-url: https://niks3.jcollie.dev

  windows:
    # Wine and a whole embedded database for a second target.
    runs-on: nixos-do-m
    enable-openid-connect: true
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Realise the Zig packages
        # zigwin32 among them; see the step of the same name above.
        run: echo "ZIG_SYSTEM=$(nix build --no-link --print-out-paths .#zig-deps)" >> "$GITHUB_ENV"

      - name: Run the tests as a Windows binary, under Wine
        # `tzdb.windows` calls into Win32 and so cannot run anywhere else,
        # which would leave the whole Windows path never executed. Wine is
        # in a shell of its own because nothing else here needs it; see
        # flake.nix. `-Dembed-tzdata` because that is the only source of
        # data on Windows, so without it `windows.loadLocal` gets as far as
        # the name and stops, and the half worth testing is the other half.
        #
        # The prefix is put in the checkout rather than left to default,
        # because Wine builds one for the first architecture it sees and
        # then refuses the other, and a runner's home directory is not
        # this job's to guess about.
        run: |
          export WINEPREFIX="$PWD/.wine"
          nix develop .#windows -c zig build test -Dtarget=x86_64-windows -Dembed-tzdata -fwine --system "$ZIG_SYSTEM" -Dupstream-system="$ZIG_SYSTEM"

      - name: Push to the cache
        if: ${{ !cancelled() && forge.ref == 'refs/heads/main' }}
        uses: https://git.jcollie.dev/jeff/niks3-push@3f85f501658e379783381291241c6f8315a92716
        with:
          server-url: https://niks3.jcollie.dev

  docs:
    needs: test
    if: ${{ forge.ref == 'refs/heads/main' }}
    runs-on: nixos-do-s
    enable-openid-connect: true
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API docs
        # Through the farm like everything else, although the docs build
        # asks for no package: `--system` makes that a fact rather than an
        # assumption, since asking for one would now fail instead of fetching.
        run: >
          nix develop .#default -c zig build docs
          --system "$(nix build --no-link --print-out-paths .#zig-deps)"

      - name: Publish docs
        run: >
          nix develop .#default -c git-pages-cli https://jeff.jcollie.page/zig-datetime/
          --server jcollie.page
          --token ${{ forge.token }}
          --upload-dir zig-out/docs

      - name: Push to the cache
        if: ${{ !cancelled() && forge.ref == 'refs/heads/main' }}
        uses: https://git.jcollie.dev/jeff/niks3-push@3f85f501658e379783381291241c6f8315a92716
        with:
          server-url: https://niks3.jcollie.dev
