# Watches for new IANA timezone database releases and opens a pull request
# pinning each one.
#
# The database is re-cut several times a year, usually because a country
# has changed its rules at short notice, so the pin in build.zig.zon goes
# stale on its own schedule rather than ours. This checks daily, and only
# opens a pull request once the new release has been compiled and the test
# suite has passed against it, so a red pull request means the release
# genuinely broke something rather than that nobody has looked yet.
#
# Each release gets its own branch, tzdata-update-<version>:
#
#   * If that branch already exists, the release has been dealt with and
#     the run stops there. Nothing is rebuilt and nothing is pushed, so a
#     pull request left open for review is never disturbed.
#   * Otherwise the branch is created and a pull request opened, and any
#     still-open pull request from an earlier tzdata-update branch is
#     closed as superseded, with a comment saying which one replaced it.
#
# Nothing is ever force-pushed and no branch is reused, so a review on a
# pull request stays attached to the release it was written about. The
# superseded branches are left in place as a record; only their pull
# requests are closed.
#
# Requirements:
#
#   * A runner offering the `nixos` label, with nix and flakes available.
#     Every step that needs a tool goes through `nix develop`, so the
#     toolchain is the one in flake.nix rather than whatever the runner
#     happens to have. Nothing is installed into the runner itself.
#   * Node on the runner, for `actions/checkout`. A runner in host mode
#     needs this in its PATH; a container-based one gets it from the
#     image.
#   * Permission to open, comment on and close pull requests. The token
#     Forgejo provides automatically has been enough here; if a step fails
#     with 403, add a personal access token with read/write on
#     `repository` and `issue` as an Actions secret named TZDATA_TOKEN and
#     it will be preferred.

name: Update tzdata

on:
  schedule:
    # Daily, at a minute nobody else picked.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'tzdb release to pin, such as 2026c. Blank means the newest published.'
        required: false
        default: ''

env:
  # Each release gets its own branch under this prefix.
  BRANCH_PREFIX: tzdata-update

jobs:
  update:
    runs-on: nixos

    steps:
      - name: Check out the repository
        # Pinned to a commit rather than a tag, so that what runs here
        # cannot change under a moved tag. The trailing comment is the
        # version that commit is, in the format pinact writes.
        #
        # The host is spelled out because a bare `actions/checkout`
        # resolves against whatever default action URL the runner is
        # configured with, which is not part of this repository.
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the update can be committed onto the
          # default branch rather than a detached shallow one.
          fetch-depth: 0
          token: ${{ secrets.TZDATA_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Look for a newer release
        id: check
        run: |
          set -eu
          # Prints the new version and edits the tree, or prints nothing
          # and leaves it alone when the pin is already current.
          version="$(nix develop --command ./tools/update-tzdata.sh ${{ github.event.inputs.version }})"

          if [ -z "$version" ]; then
            echo "Already on the newest release." >> "$GITHUB_STEP_SUMMARY"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="${BRANCH_PREFIX}-${version}"

          # A branch for this release means it has already been raised, so
          # there is nothing left to do. Checked before building, so the
          # usual daily run over an open pull request costs almost nothing.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "\`${branch}\` already exists, so ${version} has already been raised." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "A new release is available: ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Build and test against the new release
        if: steps.check.outputs.version != ''
        run: |
          set -eux
          # Compiles zic from the new sources, regenerates the embedded
          # database from it, and runs everything against the result. This
          # is the check that makes the pull request worth trusting.
          nix develop --command zig build test -Dembed-tzdata
          nix develop --command zig build test

      - name: Push the branch
        if: steps.check.outputs.version != ''
        run: |
          set -eux
          version="${{ steps.check.outputs.version }}"
          branch="${{ steps.check.outputs.branch }}"
          git config user.name 'Forgejo Actions'
          git config user.email 'actions@noreply.localhost'
          git checkout -b "$branch"
          git add build.zig build.zig.zon
          git commit --message "update to tzdata ${version}

          Pins the ${version} release of the IANA timezone database: both
          dependency hashes in build.zig.zon and the tz_release constant in
          build.zig, which the generated data records as its own version.

          Opened automatically after zic was rebuilt from the ${version}
          sources, the embedded database regenerated from it, and the test
          suite run against the result."
          # No force: the branch is new, and an existing one would have
          # stopped this run before it got here.
          git push origin "$branch"

      - name: Open the pull request and close any it supersedes
        if: steps.check.outputs.version != ''
        env:
          TOKEN: ${{ secrets.TZDATA_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="${{ steps.check.outputs.version }}"
          branch="${{ steps.check.outputs.branch }}"
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${TOKEN}"

          base="$(nix develop --command sh -c \
            "curl --fail --silent --header '$auth' '$api' | jq -r .default_branch")"

          title="Update to tzdata ${version}"
          body="$(printf '%s\n' \
            "The IANA timezone database has been re-cut as \`${version}\`." \
            "" \
            "This updates both dependency hashes in \`build.zig.zon\` and the" \
            "\`tz_release\` constant in \`build.zig\`, which the generated data" \
            "records as its own version. The three have to agree, so they are" \
            "rewritten together." \
            "" \
            "\`zic\` was rebuilt from the \`${version}\` sources, the embedded" \
            "database regenerated from it, and the full suite run against the" \
            "result before this was opened." \
            "" \
            "Raised by \`.forgejo/workflows/tzdata.yml\`. Each release gets its" \
            "own branch, so this one will not be rewritten underneath you. If a" \
            "newer release appears before this is merged, it arrives as its own" \
            "pull request and this one is closed as superseded.")"

          export TZ_API="$api" TZ_AUTH="$auth" TZ_BRANCH="$branch"
          export TZ_PREFIX="$BRANCH_PREFIX"
          export TZ_TITLE="$title" TZ_BODY="$body" TZ_BASE="$base"
          export TZ_VERSION="$version" TZ_SUMMARY="$GITHUB_STEP_SUMMARY"
          export TZ_SERVER="$GITHUB_SERVER_URL" TZ_REPO="$GITHUB_REPOSITORY"

          nix develop --command sh -eu -c '
            opened="$(jq --null-input --arg title "$TZ_TITLE" --arg body "$TZ_BODY" \
              --arg head "$TZ_BRANCH" --arg base "$TZ_BASE" \
              "{title: \$title, body: \$body, head: \$head, base: \$base}" \
              | curl --fail --silent --show-error --request POST \
                  --header "$TZ_AUTH" --header "Content-Type: application/json" \
                  --data @- "${TZ_API}/pulls" \
              | jq -r .number)"

            echo "Opened #${opened} for ${TZ_VERSION}."
            echo "Opened [#${opened}](${TZ_SERVER}/${TZ_REPO}/pulls/${opened}) for ${TZ_VERSION}." \
              >> "$TZ_SUMMARY"

            # Anything still open from an earlier release is now stale.
            # Forgejo does not filter reliably on the head query parameter,
            # so the branches are matched here instead. The bare prefix is
            # included so that the single shared branch this workflow used
            # to push to is tidied up as well.
            superseded="$(curl --fail --silent --header "$TZ_AUTH" \
              "${TZ_API}/pulls?state=open&limit=50" \
              | jq -r --arg prefix "$TZ_PREFIX" --arg keep "$TZ_BRANCH" \
                "map(select(.head.ref == \$prefix or (.head.ref | startswith(\$prefix + \"-\"))))
                 | map(select(.head.ref != \$keep))
                 | .[].number")"

            for number in $superseded; do
              echo "Closing #${number}, superseded by #${opened}"
              jq --null-input --arg body "Superseded by #${opened}, which pins tzdata ${TZ_VERSION}." \
                "{body: \$body}" \
                | curl --fail --silent --show-error --request POST \
                    --header "$TZ_AUTH" --header "Content-Type: application/json" \
                    --data @- "${TZ_API}/issues/${number}/comments" >/dev/null
              curl --fail --silent --show-error --request PATCH \
                --header "$TZ_AUTH" --header "Content-Type: application/json" \
                --data "{\"state\": \"closed\"}" "${TZ_API}/pulls/${number}" >/dev/null
              echo "Closed [#${number}](${TZ_SERVER}/${TZ_REPO}/pulls/${number}) as superseded." \
                >> "$TZ_SUMMARY"
            done
          '
